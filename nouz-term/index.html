<!doctype html>
<html lang="de" data-theme="master">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>DkZ NOUZ-Term — Ghostty / Zellij / Herdr</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@400;600;700&display=swap">
<style>
/* Tokens und Bausteine stammen aus dkz-terminal-style/ und werden von build.py eingefügt — nicht von Hand ändern. */
/* @dkz:tokens:begin */
/* DkZ Terminal Style — generated from tokens.json */
:root,[data-theme="master"]{--bg:#050507;--bg-mid:#07070a;--bg-deep:#030304;--bg-glow:#17111a;--panel-top:rgba(14,14,20,0.92);--panel-bottom:rgba(7,7,11,0.94);--bg-card:#0b0b10;--bg-elevated:#0f1016;--bg-input:#08090d;--bg-sunken:#0a0a0f;--bg-hover:#151722;--bg-overlay:#0b0c11;--border:#242632;--border-strong:#2c2e3a;--border-overlay:#353744;--border-soft:#191b24;--border-dash:#1d1f29;--text:#ececf2;--text-strong:#ffffff;--text-dim:#b6bac8;--text-muted:#8f94a4;--text-faint:#7f8798;--accent:#fa1e4e;--accent-hover:#ff3366;--on-accent:#050507;--tab-on-bg:#13090d;--tab-on-bd:#5a2231;--tab-on-fg:#ffffff;--chip-accent-bg:#17090e;--chip-accent-bd:#4d2330;--chip-accent-fg:#ff8ca8;--chip-agent-bg:rgba(18,12,28,0.55);--chip-agent-bd:rgba(153,102,255,0.4);--chip-agent-fg:#bda7ff;--green:#00ff88;--amber:#ffcc66;--cyan:#36d7ff;--lila:#9966ff;--red:#ff3b5c;--glass:rgba(11,11,16,0.86);--scrim:rgba(0,0,0,0.55);--grid-line:rgba(255,255,255,0.018);--ok:var(--green);--warn:var(--amber);--info:var(--cyan);--agent:var(--lila);--err:var(--red);--focus:var(--accent);--shadow-pane:0 18px 60px rgba(0,0,0,0.34);--shadow-pop:0 30px 120px rgba(0,0,0,1);--glow-dot:0 0 12px rgba(0,255,136,0.9)}
[data-theme="light"]{--bg:#f6f6f7;--bg-mid:#f1f1f4;--bg-deep:#e9eaee;--bg-glow:#ffffff;--panel-top:rgba(255,255,255,0.96);--panel-bottom:rgba(250,250,252,0.96);--bg-card:#ffffff;--bg-elevated:#f1f1f4;--bg-input:#ffffff;--bg-sunken:#eceef2;--bg-hover:#e6e8ee;--bg-overlay:#ffffff;--border:rgba(14,14,16,0.14);--border-strong:rgba(14,14,16,0.28);--border-overlay:rgba(14,14,16,0.3);--border-soft:rgba(14,14,16,0.08);--border-dash:rgba(14,14,16,0.12);--text:#0e0e10;--text-strong:#000000;--text-dim:#2b2d36;--text-muted:#5b5f6e;--text-faint:#666b7a;--accent:#c8103a;--accent-hover:#a50d30;--on-accent:#ffffff;--tab-on-bg:#fdeaf0;--tab-on-bd:#e9a3b6;--tab-on-fg:#7a0a26;--chip-accent-bg:#fdeaf0;--chip-accent-bd:#f1a9bd;--chip-accent-fg:#a30d31;--chip-agent-bg:#efeaff;--chip-agent-bd:#c9bcf3;--chip-agent-fg:#4a30ad;--green:#00704a;--amber:#7a5c00;--cyan:#1d628f;--lila:#5b3fc4;--red:#c8103a;--glass:rgba(255,255,255,0.88);--scrim:rgba(14,14,16,0.35);--grid-line:rgba(14,14,16,0.035);--shadow-pane:0 10px 30px rgba(14,14,16,0.12);--shadow-pop:0 30px 90px rgba(14,14,16,0.28);--glow-dot:none}
[data-theme="contrast"]{--bg:#000000;--bg-mid:#000000;--bg-deep:#000000;--bg-glow:#000000;--panel-top:#000000;--panel-bottom:#000000;--bg-card:#000000;--bg-elevated:#000000;--bg-input:#000000;--bg-sunken:#000000;--bg-hover:rgba(0,255,136,0.14);--bg-overlay:#000000;--border:#00ff88;--border-strong:#00ff88;--border-overlay:#00ff88;--border-soft:#00ff88;--border-dash:#00ff88;--text:#00ff88;--text-strong:#00ff88;--text-dim:#00ff88;--text-muted:rgba(0,255,136,0.78);--text-faint:rgba(0,255,136,0.62);--accent:#00ff88;--accent-hover:#00ff88;--on-accent:#000000;--tab-on-bg:#00ff88;--tab-on-bd:#00ff88;--tab-on-fg:#000000;--chip-accent-bg:#000000;--chip-accent-bd:#00ff88;--chip-accent-fg:#00ff88;--chip-agent-bg:#000000;--chip-agent-bd:#00ff88;--chip-agent-fg:#00ff88;--green:#00ff88;--amber:#00ff88;--cyan:#00ff88;--lila:#00ff88;--red:#00ff88;--glass:rgba(0,0,0,0.92);--scrim:rgba(0,0,0,0.8);--grid-line:rgba(0,255,136,0.06);--shadow-pane:0 0 20px rgba(0,255,136,0.2);--shadow-pop:0 0 40px rgba(0,255,136,0.25);--glow-dot:0 0 12px rgba(0,255,136,0.9)}
[data-theme="control"]{--bg:#050507;--bg-mid:#07070a;--bg-deep:#030304;--bg-glow:#1a0f14;--panel-top:rgba(14,14,20,0.92);--panel-bottom:rgba(7,7,11,0.94);--bg-card:#0b0b10;--bg-elevated:#0f1016;--bg-input:#08090d;--bg-sunken:#0a0a0f;--bg-hover:#151722;--bg-overlay:#0b0c11;--border:rgba(250,30,78,0.3);--border-strong:rgba(250,30,78,0.5);--border-overlay:rgba(250,30,78,0.55);--border-soft:rgba(250,30,78,0.2);--border-dash:rgba(250,30,78,0.2);--text:#ececf2;--text-strong:#ffffff;--text-dim:#b6bac8;--text-muted:#8f94a4;--text-faint:#7f8798;--accent:#fa1e4e;--accent-hover:#ff3366;--on-accent:#050507;--tab-on-bg:#13090d;--tab-on-bd:#5a2231;--tab-on-fg:#ffffff;--chip-accent-bg:#17090e;--chip-accent-bd:#4d2330;--chip-accent-fg:#ff8ca8;--chip-agent-bg:rgba(18,12,28,0.55);--chip-agent-bd:rgba(153,102,255,0.4);--chip-agent-fg:#bda7ff;--green:#00ff88;--amber:#ffcc66;--cyan:#36d7ff;--lila:#9966ff;--red:#ff3b5c;--glass:rgba(11,11,16,0.86);--scrim:rgba(0,0,0,0.55);--grid-line:rgba(255,255,255,0.018);--shadow-pane:0 18px 60px rgba(0,0,0,0.34);--shadow-pop:0 30px 120px rgba(0,0,0,1);--glow-dot:0 0 12px rgba(0,255,136,0.9)}
[data-theme="content"]{--bg:#0c0a12;--bg-mid:#0f0c16;--bg-deep:#08060d;--bg-glow:#1d1530;--panel-top:rgba(21,18,29,0.94);--panel-bottom:rgba(16,13,23,0.96);--bg-card:#15121d;--bg-elevated:#1b1726;--bg-input:#100e17;--bg-sunken:#100d17;--bg-hover:#221d30;--bg-overlay:#15121d;--border:rgba(157,123,255,0.18);--border-strong:rgba(157,123,255,0.34);--border-overlay:rgba(157,123,255,0.42);--border-soft:rgba(157,123,255,0.12);--border-dash:rgba(157,123,255,0.14);--text:#f3f0fa;--text-strong:#ffffff;--text-dim:#cfc9e0;--text-muted:#a59fb8;--text-faint:#8d86a3;--accent:#ff3366;--accent-hover:#ff6688;--on-accent:#050507;--tab-on-bg:#1c0a14;--tab-on-bd:#6a2640;--tab-on-fg:#ffffff;--chip-accent-bg:#1f0c15;--chip-accent-bd:#5c2538;--chip-accent-fg:#ff9db6;--chip-agent-bg:rgba(40,28,70,0.55);--chip-agent-bd:rgba(157,123,255,0.5);--chip-agent-fg:#d4c6ff;--green:#00d084;--amber:#e8c547;--cyan:#55acee;--lila:#9d7bff;--red:#ff3b5c;--glass:rgba(21,18,29,0.86);--scrim:rgba(12,10,18,0.65);--grid-line:rgba(157,123,255,0.03);--shadow-pane:0 18px 60px rgba(0,0,0,0.4);--shadow-pop:0 30px 120px rgba(0,0,0,0.9);--glow-dot:0 0 12px rgba(0,208,132,0.8)}
:root{--space-xs:4px;--space-sm:8px;--space-md:12px;--space-lg:16px;--space-xl:24px;--space-2xl:32px;--radius:13px;--radius-sm:8px;--radius-pill:999px;--font-main:"Inter", system-ui, -apple-system, "Segoe UI", sans-serif;--font-mono:"JetBrains Mono", ui-monospace, Consolas, monospace;--font-display:"Archivo", "Inter", system-ui, sans-serif}
/* @dkz:tokens:end */
/* @dkz:terminal:begin */
/* DkZ Terminal Style — Bausteine (tm-*). Nutzt ausschließlich Tokens aus tokens.css, kein Hex.
   Theme-Struktur (Radius, Schrift, Fase, Kerbe) steht unten; Farben stehen in tokens.json. */
:root{--notch:block}
[data-theme="contrast"]{--radius:0px;--radius-sm:0px;--radius-pill:0px;--notch:none;--font-main:var(--font-mono)}
[data-theme="control"]{--radius:0px;--radius-sm:0px;--notch:none;--font-main:"Archivo","Inter",system-ui,sans-serif}
[data-theme="content"]{--radius:18px;--radius-sm:12px;--radius-pill:50px;--font-main:"Syne","Inter",system-ui,sans-serif;--font-mono:"Space Mono",ui-monospace,Consolas,monospace}

*,*::before,*::after{box-sizing:border-box}
.tm-page{margin:0;min-height:100dvh;color:var(--text);font:400 14px/1.55 var(--font-main);-webkit-font-smoothing:antialiased;
  background:radial-gradient(circle at 50% -10%,var(--bg-glow) 0,var(--bg-mid) 42%,var(--bg-deep) 100%) var(--bg)}
.tm-page::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:linear-gradient(var(--grid-line) 1px,transparent 1px),linear-gradient(90deg,var(--grid-line) 1px,transparent 1px);background-size:24px 24px}
.tm-page :focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.tm-page button{font:inherit;color:inherit}
.tm-skip{position:absolute;left:-999px;top:8px;z-index:30;background:var(--accent);color:var(--on-accent);padding:8px 12px;border-radius:var(--radius-sm)}
.tm-skip:focus{left:8px}
.tm-sr{position:absolute;width:1px;height:1px;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
/* Bühne für Einbettungen und Vorschauen: gleiche Grundwerte wie die Seite, aber ohne Vollbild-Höhe. */
.tm-stage{padding:var(--space-lg);background:var(--bg);color:var(--text);font:400 14px/1.55 var(--font-main)}

/* ── Rahmen der Seite ─────────────────────────────────────────────── */
.tm-app{position:relative;z-index:1;min-height:100dvh;display:flex;flex-direction:column;gap:var(--space-sm);
  padding:var(--space-md) max(var(--space-lg),env(safe-area-inset-right)) var(--space-md) max(var(--space-lg),env(safe-area-inset-left))}
.tm-top,.tm-status{display:flex;flex-wrap:wrap;align-items:center;gap:var(--space-sm) var(--space-lg);padding:var(--space-sm) var(--space-lg);
  background:var(--glass);border:1px solid var(--border);border-radius:var(--radius);backdrop-filter:blur(8px);box-shadow:var(--shadow-pane)}
.tm-top{min-height:48px}
.tm-brand{font:800 14px/1 var(--font-main);letter-spacing:.08em}
.tm-brand b{color:var(--accent)}
.tm-tabs{display:flex;flex-wrap:wrap;gap:var(--space-sm)}
.tm-tab{min-height:36px;padding:0 12px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--bg-sunken);
  color:var(--text-muted);font:600 12px/1 var(--font-mono);cursor:pointer}
.tm-tab:hover{color:var(--text-strong)}
.tm-tab[aria-selected="true"]{color:var(--tab-on-fg);background:var(--tab-on-bg);border-color:var(--tab-on-bd);
  box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--accent) 25%,transparent)}
.tm-count{color:var(--ok)}
.tm-meta{margin-left:auto;display:flex;flex-wrap:wrap;align-items:center;gap:var(--space-sm) var(--space-md);font:12px var(--font-mono);color:var(--text-muted)}
.tm-dot{display:inline-block;width:7px;height:7px;margin-right:6px;border-radius:var(--radius-pill);background:var(--ok);box-shadow:var(--glow-dot)}
.tm-mode{padding:3px 8px;border:1px solid var(--chip-accent-bd);border-radius:var(--radius-pill);background:var(--chip-accent-bg);color:var(--chip-accent-fg);font-weight:700;letter-spacing:.08em}
.tm-themes{display:flex;gap:var(--space-sm)}
.tm-theme{width:28px;height:28px;padding:0;border:1px solid var(--border-strong);border-radius:var(--radius-pill);cursor:pointer;
  background:linear-gradient(135deg,var(--bg) 50%,var(--accent) 50%)}
.tm-theme[aria-pressed="true"]{outline:2px solid var(--focus);outline-offset:2px}

/* ── Arbeitsfläche: Raster je Ansicht (data-view) ─────────────────── */
.tm-workspace{flex:1;min-height:0;display:grid;gap:var(--space-sm);grid-template-columns:minmax(0,1fr)}
.tm-a-files{grid-area:files}.tm-a-preview{grid-area:preview}.tm-a-term{grid-area:term}.tm-a-input{grid-area:input}
.tm-a-side{grid-area:side}.tm-a-graph{grid-area:graph}.tm-a-services{grid-area:services}
.tm-workspace[data-view="herd"]{grid-template-areas:"term" "input" "side" "files"}
.tm-workspace[data-view="files"]{grid-template-areas:"files" "preview" "term" "input"}
.tm-workspace[data-view="knowledge"]{grid-template-areas:"graph" "side" "term" "input"}
.tm-workspace[data-view="services"]{grid-template-areas:"services" "term" "input"}
@media (min-width:640px){
  .tm-workspace{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .tm-workspace[data-view="herd"]{grid-template-areas:"term term" "input input" "files side"}
  .tm-workspace[data-view="files"]{grid-template-areas:"files preview" "term term" "input input"}
  .tm-workspace[data-view="knowledge"]{grid-template-areas:"graph graph" "side side" "term term" "input input"}
  .tm-workspace[data-view="services"]{grid-template-areas:"services services" "term term" "input input"}
}
@media (min-width:1050px){
  .tm-app{height:100dvh;min-height:0}
  .tm-workspace[data-view="herd"]{grid-template-columns:290px minmax(0,1fr) 300px;grid-template-rows:minmax(0,1fr) auto;grid-template-areas:"files term side" "files input side"}
  .tm-workspace[data-view="files"]{grid-template-columns:340px minmax(0,1fr);grid-template-rows:minmax(0,1fr) 168px auto;grid-template-areas:"files preview" "term term" "input input"}
  .tm-workspace[data-view="knowledge"]{grid-template-columns:minmax(0,1fr) 320px;grid-template-rows:minmax(0,1fr) 168px auto;grid-template-areas:"graph side" "term term" "input input"}
  .tm-workspace[data-view="services"]{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) 168px auto;grid-template-areas:"services" "term" "input"}
}

/* ── Panel ────────────────────────────────────────────────────────── */
.tm-panel{position:relative;min-width:0;min-height:0;display:flex;flex-direction:column;overflow:hidden;
  background:linear-gradient(180deg,var(--panel-top),var(--panel-bottom));border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-pane)}
.tm-panel[hidden]{display:none}
.tm-panel::before{content:"";position:absolute;left:50%;top:-1px;z-index:2;width:76px;height:9px;transform:translateX(-50%);
  border:1px solid var(--border);border-top:0;border-radius:0 0 12px 12px;background:var(--bg-input);display:var(--notch)}
.tm-title{display:flex;align-items:center;gap:var(--space-sm);flex:none;min-height:38px;margin:0;padding:0 var(--space-md);border-bottom:1px solid var(--border-soft);
  font:700 11px/1 var(--font-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--text-dim)}
.tm-tag{margin-left:auto;color:var(--ok)}
.tm-scroll{flex:1;min-height:0;overflow:auto}
@media (max-width:1049px){
  .tm-a-files .tm-scroll,.tm-a-side .tm-scroll,.tm-a-preview .tm-scroll{max-height:42dvh}
  .tm-a-graph .tm-scroll,.tm-a-services .tm-scroll{max-height:60dvh}
}

/* ── Dateibaum + Vorschau ─────────────────────────────────────────── */
.tm-tree{padding:var(--space-sm);font:12px/1.7 var(--font-mono)}
.tm-sub{padding:var(--space-sm) var(--space-sm) var(--space-xs);color:var(--text-muted);font:700 11px var(--font-mono);letter-spacing:.08em}
.tm-leaf,.tm-agent{display:flex;align-items:baseline;gap:6px;width:100%;margin:0;padding:4px 8px 4px calc(8px + var(--d,0) * 14px);border:0;border-radius:6px;
  background:none;color:var(--text-dim);font:inherit;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.tm-leaf:hover,.tm-agent:hover,.tm-leaf[aria-current="true"],.tm-agent[aria-current="true"]{background:var(--bg-hover);color:var(--text-strong)}
.tm-leaf[aria-current="true"]{box-shadow:inset 2px 0 var(--accent)}
.tm-agent[aria-current="true"]{box-shadow:inset 2px 0 var(--agent)}
.tm-glyph{flex:none;width:1.1em;color:var(--text-muted)}
.tm-name{overflow:hidden;text-overflow:ellipsis}
@media (pointer:coarse){.tm-leaf,.tm-agent{padding-block:9px}.tm-tab{min-height:44px}}
.tm-dl{margin:0;padding:var(--space-md);display:grid;grid-template-columns:max-content 1fr;gap:var(--space-sm) var(--space-lg);font:12px/1.6 var(--font-mono)}
.tm-dl dt{color:var(--text-muted)}
.tm-dl dd{margin:0;color:var(--text);overflow-wrap:anywhere}
.tm-miss{color:var(--text-faint)}

/* ── Terminal ─────────────────────────────────────────────────────── */
.tm-term{flex:1;min-height:0}
.tm-term-head{display:flex;flex-wrap:wrap;align-items:center;gap:var(--space-sm);flex:none;padding:var(--space-sm) var(--space-md);border-bottom:1px solid var(--border-soft);font:12px var(--font-mono)}
.tm-crumb{color:var(--text-dim)}.tm-crumb span{color:var(--text-muted)}
.tm-badge{margin-left:auto;padding:4px 8px;border:1px solid var(--chip-accent-bd);border-radius:var(--radius-pill);background:var(--chip-accent-bg);color:var(--chip-accent-fg);font:600 11px var(--font-mono)}
.tm-term-body{position:relative;flex:1;min-height:0;overflow:auto;padding:var(--space-md);font:13px/1.55 var(--font-mono);
  background:radial-gradient(circle at 70% 20%,color-mix(in srgb,var(--agent) 8%,transparent),transparent 28%),radial-gradient(circle at 30% 80%,color-mix(in srgb,var(--accent) 6%,transparent),transparent 26%)}
@media (max-width:1049px){.tm-a-term .tm-term-body{min-height:200px;max-height:46dvh}}
.tm-workspace:not([data-view="herd"]) .tm-a-term .tm-term-body{max-height:168px;min-height:96px}
.tm-bg-graph{position:absolute;inset:0;width:100%;height:100%;opacity:.28;pointer-events:none}
.tm-log{position:relative;z-index:1;white-space:pre-wrap;overflow-wrap:anywhere}
.tm-log>div{min-height:1.55em}
.tm-c-ok{color:var(--ok)}.tm-c-warn{color:var(--warn)}.tm-c-info{color:var(--info)}.tm-c-agent{color:var(--agent)}
.tm-c-err{color:var(--err)}.tm-c-muted{color:var(--text-muted)}.tm-c-strong{color:var(--text-strong)}

/* ── Herd + Wissen ────────────────────────────────────────────────── */
.tm-herd{padding:var(--space-sm) 10px;font:12px/1.58 var(--font-mono)}
.tm-state{margin-left:auto;padding-left:var(--space-sm);font-size:10px;white-space:nowrap}
.tm-s-ok{color:var(--ok)}.tm-s-warn{color:var(--warn)}.tm-s-faint{color:var(--text-faint)}.tm-s-err{color:var(--err)}
.tm-new{color:var(--accent);font-size:9px}
.tm-workspace[data-view="knowledge"] .tm-sec-herd{display:none}
.tm-know{padding:var(--space-sm) 11px;font:12px var(--font-mono)}
.tm-krow{display:grid;grid-template-columns:minmax(64px,92px) minmax(0,1fr) auto;gap:var(--space-sm);width:100%;margin:0;padding:6px 0;border:0;border-bottom:1px dashed var(--border-dash);background:none;color:inherit;font:inherit;text-align:left;cursor:pointer}
.tm-krow:hover{background:var(--bg-hover)}
.tm-krow b{color:var(--text)}
.tm-krow span:nth-child(2){color:var(--text-dim);overflow-wrap:anywhere}

/* ── Prompt ───────────────────────────────────────────────────────── */
.tm-input{padding:var(--space-md);flex:none}
.tm-suggest{display:grid;grid-template-columns:76px minmax(0,1fr);gap:var(--space-sm);min-height:1.6em;margin-bottom:var(--space-sm);font:11px var(--font-mono);color:var(--text-muted)}
.tm-suggest b{color:var(--info)}
.tm-prompt{display:flex;align-items:center;height:44px;padding:0 var(--space-md);border:1px solid var(--border-strong);border-radius:var(--radius-sm);background:var(--bg-input);font:14px var(--font-mono)}
.tm-prompt:focus-within{border-color:var(--focus);box-shadow:0 0 0 2px color-mix(in srgb,var(--focus) 35%,transparent)}
.tm-p{margin-right:var(--space-sm);color:var(--accent);font-weight:800}
.tm-cmd{flex:1;min-width:0;border:0;outline:0;background:transparent;color:var(--text-strong);font:inherit}
.tm-cmd::placeholder{color:var(--text-muted)}

/* ── Graph + Tabelle ──────────────────────────────────────────────── */
.tm-graph{display:block;width:100%}
.tm-graph-main{height:clamp(260px,52dvh,520px)}
.tm-gedge{stroke:var(--chip-agent-bd);stroke-width:1;fill:none}
.tm-gnode rect{fill:var(--chip-agent-bg);stroke:var(--chip-agent-bd)}

  cands = cands.filter(function (x) { return x.toLowerCase().indexOf(v.toLowerCase()) === 0; });
  if (!cands.length) { renderSuggest(); return; }
  var cp = common(cands); if (cp.length > v.length) c.value = cp;
  if (cands.length === 1) c.value = cands[0] + (cands[0].charAt(0) === '@' ? ' ' : '');
  renderSuggest(cands.length > 1 ? cands.join('   ') : null);
}

// ── Start ───────────────────────────────────────────────────────────
function start() {
  D = readData();
  var tabs = $('#tabs');
  tabs.replaceChildren.apply(tabs, VIEWS.map(function (v) {
    return h('button', { class: 'tm-tab', role: 'tab', id: 'tab-' + v[0], type: 'button', 'aria-controls': 'workspace', onclick: function () { setView(v[0]); } },
      v[1], v[0] === 'herd' ? [' ', h('span', { class: 'tm-count', id: 'count' }, '')] : null);
  }));
  tabs.addEventListener('keydown', function (e) {
    var i = VIEWS.map(function (v) { return v[0]; }).indexOf(S.view), n = e.key === 'ArrowRight' ? i + 1 : e.key === 'ArrowLeft' ? i - 1 : e.key === 'Home' ? 0 : e.key === 'End' ? VIEWS.length - 1 : null;
    if (n === null) return; e.preventDefault(); n = (n + VIEWS.length) % VIEWS.length; setView(VIEWS[n][0]); $('#tab-' + VIEWS[n][0]).focus();
  });
  D.files.forEach(function (f) { if (f.type === 'dir') S.open[f.path] = D.files.length <= 60 || f.depth < 1; });
  var f0 = findFile(D.meta.file) || leaves()[0] || D.files[0]; S.file = f0 ? f0.path : null;
  S.agent = (findAgent(D.meta.focus) || D.agents[0] || {}).id || null;
  if (S.agent) { logOf(S.agent).push.apply(logOf(S.agent), D.boot.filter(Array.isArray)); }
  D.agents.forEach(function (a) { if (Array.isArray(a.log)) logOf(a.id).push.apply(logOf(a.id), a.log.filter(Array.isArray)); });
  renderTree(); renderHerd(); renderKnow(); renderServices(); renderStatus(); renderCrumb(); renderSuggest(); renderLog(); drawGraphs();
  var t = recall('dkz-theme'); setTheme(THEMES.some(function (x) { return x[0] === t; }) ? t : 'master');
  setView('herd'); watchGraphs();
  if (D.meta.mode === 'live') say([['m', '[export]'], ['', ' Live-Daten geladen · ' + str(D.meta.generated || MISSING)]]);

  var cmd = $('#cmd');
  cmd.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { run(cmd.value); }
    else if (e.key === 'ArrowUp' && S.hist.length) { e.preventDefault(); S.hi = Math.max(0, S.hi - 1); cmd.value = S.hist[S.hi]; }
    else if (e.key === 'ArrowDown' && S.hist.length) { e.preventDefault(); S.hi = Math.min(S.hist.length, S.hi + 1); cmd.value = S.hist[S.hi] || ''; }
    else if (e.key === 'Tab' && !e.shiftKey && cmd.value) { e.preventDefault(); complete(); }
    else if (e.key === 'Escape') { cmd.value = ''; renderSuggest(); }
    else if (e.key === 'l' && e.ctrlKey) { e.preventDefault(); CMD.clear(); }
  });
  cmd.addEventListener('input', function () { renderSuggest(); });
  $('#pal-in').addEventListener('input', function () { S.palSel = 0; renderPal(); });
  $('#pal-in').addEventListener('keydown', function (e) {
    var n = S.palShown.length;
    if (e.key === 'ArrowDown') { e.preventDefault(); S.palSel = n ? (S.palSel + 1) % n : 0; syncPal(); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); S.palSel = n ? (S.palSel - 1 + n) % n : 0; syncPal(); }
    else if (e.key === 'Enter') { e.preventDefault(); palRun(S.palSel); }
    else if (e.key === 'Tab') { e.preventDefault(); }
  });
  $('#pal').addEventListener('click', function (e) { if (e.target === $('#pal')) closePal(); });
  document.addEventListener('keydown', function (e) {
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'p') { e.preventDefault(); if ($('#pal').classList.contains('is-open')) closePal(); else openPal(); }
    else if (e.key === 'Escape') closePal();
    else if (e.altKey && /^[1-4]$/.test(e.key)) { e.preventDefault(); setView(VIEWS[+e.key - 1][0]); }
  });
  if (!matchMedia('(pointer:coarse)').matches) cmd.focus();
}

// Live-Daten nur auf ausdrücklichen Wunsch (index.html?live), damit kein 404 in der Konsole steht.
if (/[?&]live\b/.test(location.search)) {
  var sc = h('script', { src: 'data.local.js' });
  sc.addEventListener('load', start);
  sc.addEventListener('error', function () { start(); say([['e', '[export]'], ['', ' data.local.js fehlt — erst „odysseus nouz export" ausführen. Es bleiben die Demo-Daten.']]); });
  document.head.append(sc);
} else start();
})();
