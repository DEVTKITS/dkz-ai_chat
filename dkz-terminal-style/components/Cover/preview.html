<style>
html,body{margin:0;background:var(--bg)}
.cv{position:relative;width:960px;height:300px;overflow:hidden;background:var(--bg);color:var(--text)}
.cv svg{position:absolute;left:0;top:0;display:block}
.b-accent{fill:var(--accent)}.b-green{fill:var(--green)}.b-cyan{fill:var(--cyan)}.b-lila{fill:var(--lila)}.b-amber{fill:var(--amber)}
.b-slab{fill:var(--bg-hover);stroke:var(--border-strong);stroke-width:1}
.tile{rx:var(--radius)}
.dot-a{fill:var(--accent)}.dot-g{fill:var(--green)}.dot-m{fill:var(--text-muted)}
.cv .name{position:absolute;left:32px;top:132px;margin:0;font:800 64px/.95 var(--font-display);letter-spacing:-.01em;color:var(--text-strong);white-space:nowrap}
.cv .tag{position:absolute;left:32px;top:206px;margin:0;font:400 14px/1.3 var(--font-mono);color:var(--text-muted);max-width:440px}
</style>
<div class="cv">
<!--
Derivation
Blocks: accent 260x113, green 100x113, bg-hover+border-strong slab 200x113, cyan 56x113, lila 88x113 (heights 100 + radius bleed off the top); accent and green carry the weight, the rest is relief.
Arrangement: one strip of unequal bands, flush from the left edge, bleeding off the top, followed by a dot field filling the right end of the strip.
Pattern: dot grid at space-xl (24px) pitch, 4 rows x 7 columns in accent, green and text-muted — a precise, mono, grid-based terminal system lands on a technical dot grid, not on discs or stripes.
Steps and radii: space-xl 24 (pitch), space-lg 16 (gaps in the dot field), radius 13 on every block.
-->
<svg width="960" height="113" viewBox="0 0 960 113" role="img" aria-label="Farbflächen und Punktraster des DkZ Terminal Style">
  <rect class="tile b-accent" x="0" y="-13" width="260" height="113"/>
